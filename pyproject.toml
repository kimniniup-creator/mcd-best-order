[project]
name = "coupon-split"
version = "0.9.3"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.28.1,<2",
    "uvicorn>=0.35",
    "python-dotenv>=1.1",
    "qrcode>=8.2",
    "tzdata>=2025.2",
    "keyring>=25.7.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "playwright>=1.55",
    "pypinyin>=0.55.0",
    "opencc-python-reimplemented>=0.1.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
coupon-split = "coupon_split.cli:main"
coupon-split-mcp = "coupon_split.stdio:main"

[tool.hatch.build.targets.wheel]
packages = ["coupon_split"]

[tool.hatch.build.targets.sdist]
include = ["coupon_split", "web", "skills", "hooks", ".claude-plugin", ".mcp.json", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "coupon_split/assets/web"

"skills" = "coupon_split/assets/skills"
"hooks" = "coupon_split/assets/hooks"
