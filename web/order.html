<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>点餐 · 最优下单</title><link rel="stylesheet" href="/design/tokens.css"><link rel="stylesheet" href="/design/v2/v2.css"><link rel="stylesheet" href="/web/order.css"></head>
<body><header class="pk-top"><div class="pk-top__in"><span class="brandmark">最优下单 · 点餐</span><span class="pk-top__from"><i></i><span id="connection">选好会自动接着算；如果没接上，回来说一句“好了”</span></span></div></header>
<main class="pk"><section class="els" id="els" aria-label="订单要素"></section><output id="status" role="status">正在加载这家店的菜单…</output>
<div class="pk-body"><nav class="cats" id="cats" aria-label="菜单分类"></nav><section class="menu" aria-label="全菜单"><div class="tools"><label class="search"><span class="vh">搜索餐品</span><input id="query" type="search" placeholder="搜索餐品名称" autocomplete="off"></label><div class="rec-toggle"><span>帮我推荐</span><span class="switch-hit"><button class="switch" id="recommend" role="switch" aria-checked="false" aria-label="帮我推荐"></button></span></div></div><div class="rec" id="rec" hidden><label>几个人（选填）<input id="people" type="number" min="1" max="12" placeholder="选填"></label><button class="btn btn--ghost btn--sm" id="regenerate">重新配一份</button><p id="rec-items">推荐来自这家店现在的菜单，每一项都能改。</p></div><div id="menu"></div></section><aside class="aside" aria-label="已选"><div class="cart" id="cart"></div></aside></div></main>
<div class="mbar" id="mbar"></div>
<section class="done" aria-live="polite"><div class="done__card"><div class="done__ok" aria-hidden="true"></div><h1 id="done-title">已交回对话，Agent 会继续</h1><p>这个页面可以关掉了。回到对话看方案，再确认下单。</p><div class="done__got"><div class="k">交回去的内容</div><ul id="doneList"></ul></div><div class="done__steps"><div class="is-ok">点餐页已提交</div><div class="is-now" id="progress">等待 Agent 接收</div><div>在对话里看方案、确认下单</div></div><div class="done__foot"><span>对话里没动静？回去说一句“好了”。</span><button class="link" id="edit-again">回来改</button></div></div></section>
<dialog id="sheet"><div class="sheet__head sheet__head--plain"><h2 class="sheet__title" id="sheet-title"></h2><button class="x" aria-label="关闭" id="close-sheet"></button></div><div class="sheet__body" id="sheet-body"></div><div class="sheet__foot"><button class="btn btn--block" id="sheet-save">好了</button></div></dialog>
<script type="module" src="/web/order.js"></script></body></html>
