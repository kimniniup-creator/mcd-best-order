<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>点餐 · 最优下单</title><link rel="stylesheet" href="/design/tokens.css"><link rel="stylesheet" href="/design/v2/v2.css"><link rel="stylesheet" href="/web/order.css"><link rel="stylesheet" href="/web/order-v3.css"></head>
<body><div class="shell"><header class="pk-top top"><div class="pk-top__in top__in"><span class="brandmark">最优下单 · 点餐</span><span class="pk-top__from link-state" id="link-state" data-state="checking" role="status" aria-live="polite"><i></i><span id="connection">正在确认连接…</span></span><button id="search-toggle" class="ib ib--ghost" aria-label="搜索餐品"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button></div></header>
<main class="pk"><section class="els" id="els" aria-label="订单要素"></section><output id="status" role="status">正在加载这家店的菜单…</output>
<div class="pk-body body"><nav class="cats rail" id="cats" aria-label="菜单分类"></nav><section class="menu list" aria-label="全菜单"><div class="tools"><label class="search"><span class="vh">搜索餐品</span><input id="query" type="search" placeholder="搜索餐品名称" autocomplete="off"></label></div><div class="recard"><div class="rec-toggle recard__h"><div class="recard__t"><b>帮我推荐</b><span>先配一份，每一项都能改</span></div><span class="recard__st">关</span><span class="switch-hit"><button class="switch sw" id="recommend" role="switch" aria-checked="false" aria-label="帮我推荐"><i>−</i></button></span></div><div class="rec recard__p" id="rec" hidden><label>几个人（选填）<input id="people" type="number" min="1" max="12" placeholder="选填"></label><button class="btn2" id="regenerate">生成推荐</button><button class="btn2" id="add-recommendation" hidden>把推荐加入已选</button><p class="rp__note" id="rec-items">推荐来自这家店现在的菜单，每一项都能改。</p><p class="rec-hint">想要更合口味的，回对话说“帮我配”。</p></div></div><div id="menu"></div></section><aside class="aside" aria-label="已选"><div class="cart" id="cart"></div></aside></div></main></div>
<div class="mbar" id="mbar"></div>
<section class="done" aria-live="polite"><div class="done__card rc"><div class="done__ok rc__ok" aria-hidden="true"></div><h1 id="done-title">已交回对话，助手会继续</h1><p>这个页面可以关掉了。回到对话看方案，再确认下单。</p><div class="done__got"><div class="k">交回去的内容</div><ul id="doneList"></ul></div><div class="done__steps"><div class="is-ok">点餐页已提交</div><div class="is-now" id="progress">等待 助手接收</div><div>在对话里看方案、确认下单</div></div><div class="done__foot"><span>对话里没动静？回去说一句“好了”。</span><button class="tbtn" id="edit-again">回来改</button></div></div></section>
<dialog id="sheet"><div class="sheet__head sheet__head--plain"><h2 class="sheet__title" id="sheet-title"></h2><button class="x" aria-label="关闭" id="close-sheet"></button></div><div class="sheet__body" id="sheet-body"></div><div class="sheet__foot"><button class="btn btn--block" id="sheet-save">好了</button></div></dialog>
<script type="module" src="/web/order.js"></script></body></html>
